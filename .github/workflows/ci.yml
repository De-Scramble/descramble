name: CI

# Continuous verification from the first release, not a check bolted on later.
# A red suite blocks the merge: the three properties this project guarantees —
# duplicates cluster, distinct records stay apart, the same input gives the same
# answer — are only guarantees if something enforces them on every change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # The lakehouse warehouse location is built differently on Windows,
          # and the difference is invisible on POSIX. It is covered here
          # because it was a real defect, not a hypothetical one.
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest -q

  gpl-free-install:
    name: igraph-free install path
    runs-on: ubuntu-latest
    # The recommended install must keep working AND must keep igraph out. Both
    # halves are load-bearing: the pinned manifest is installed with --no-deps,
    # so if it ever becomes incomplete the failure is an ImportError here rather
    # than a broken install for a user. And if a future dependency bump
    # reintroduces igraph, this job fails instead of quietly shipping GPL code.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install via the documented igraph-free path
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r requirements.txt
          python -m pip install --no-deps .
          python -m pip install --no-deps pytest==9.1.1 iniconfig==2.3.0 pluggy==1.6.0

      - name: Assert igraph is absent
        run: |
          if python -m pip show igraph > /dev/null 2>&1; then
            echo "::error::igraph is installed; the igraph-free install path has regressed"
            python -m pip show igraph
            exit 1
          fi
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("igraph") is not None:
              print("igraph is importable; the igraph-free install path has regressed")
              sys.exit(1)
          print("confirmed: igraph is neither installed nor importable")
          PY

      - name: The full suite must pass without igraph
        run: python -m pytest -q

      - name: The pipeline must run without igraph
        run: python -m descramble demo

  demo:
    name: end-to-end demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Resolve the bundled sample end to end
        # Proves the quickstart in the README still works from a clean checkout:
        # read the sample data, resolve it, write an Iceberg table, report.
        run: python -m descramble demo

      - name: Confirm the lakehouse table was written and is readable
        run: |
          python - <<'PY'
          from descramble.config import PipelineConfig
          from descramble.lakehouse import Lakehouse

          golden = Lakehouse(PipelineConfig()).read_golden_records()
          assert len(golden) > 0, "no golden records were written"
          assert golden["cluster_id"].is_unique, "cluster identifiers are not unique"
          print(f"read back {len(golden):,} golden records from the Iceberg table")
          PY
